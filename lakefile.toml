name = "hex-gf2-mathlib"
defaultTargets = ["HexGF2Mathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGF2"
git = "https://github.com/leanprover/hex-gf2.git"
rev = "22a330f6ae7cfac7330b3d0a289f3db761a3a940"

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "3d2cc1c30b0e17dfec35858e9d5fa8d75e1f241b"

[[require]]
name = "HexGFqField"
git = "https://github.com/leanprover/hex-gfq-field.git"
rev = "34b687dab548ce2d8bd382bfb5cecf1b314ca38a"

[[require]]
name = "HexPolyFpMathlib"
git = "https://github.com/leanprover/hex-poly-fp-mathlib.git"
rev = "e46f2f401aaf969d77db8003f235686449cf0c3f"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "HexGF2Mathlib"
