name = "hex-gf2-mathlib"
defaultTargets = ["HexGF2Mathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGF2"
git = "https://github.com/leanprover/hex-gf2.git"
rev = "df31f2b5b3d7f16b344324d7db6566e2155d0824"

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "1a21ec21624b3353559d0d6f386e5d5f24ccbc62"

[[require]]
name = "HexGFqField"
git = "https://github.com/leanprover/hex-gfq-field.git"
rev = "a30fde3f1cfec4b312e74d5fa54eca30438b9a5f"

[[require]]
name = "HexPolyFpMathlib"
git = "https://github.com/leanprover/hex-poly-fp-mathlib.git"
rev = "4cf1484372c505472e554dbcfade0a415bff9820"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexGF2Mathlib"
